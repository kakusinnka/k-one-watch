name: watch

on:
  schedule:
    # 实测：配 */15 时 GitHub 只执行了约 5%（100 次 run 平均间隔 289 分钟）。
    # 它是按比例丢弃的，所以多申请能换来多一点实际执行 —— 公开仓库分钟数免费。
    # 真正的补偿手段是下面的 --repeat：让每次被叫醒的 run 覆盖 20 多分钟。
    - cron: '*/5 * * * *'
  workflow_dispatch:        # 允许在 Actions 页面手动点一次
    inputs:
      mode:
        description: 手动触发时做什么
        type: choice
        default: check
        options:
          - check        # 照常跑一轮，只推新空位
          - force        # 无视已通知名单，把当前空位全部重推（验证推送链路）
          - test-notify  # 只发一条测试消息，不查空位

concurrency:
  # 上一轮没跑完就不要叠下一轮，否则会重复推送
  group: k-one-watch
  cancel-in-progress: false

permissions:
  contents: write           # 回写 state/seen.json 需要

jobs:
  check:
    runs-on: ubuntu-latest
    # 容得下 8 轮 x 180 秒的轮询循环
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 需要 3.11+ 的 tomllib；本项目零第三方依赖

      - name: 查询空位并推送
        env:
          BARK_URL:       ${{ secrets.BARK_URL }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASS:      ${{ secrets.SMTP_PASS }}
          SMTP_TO:        ${{ secrets.SMTP_TO }}
          MODE:           ${{ inputs.mode || 'check' }}
        # 经 env 传入而不是直接内插，避免把输入拼进 shell
        run: |
          set -euo pipefail
          case "$MODE" in
            test-notify) python watch.py test-notify ;;
            force)       python watch.py check --force ;;
            *)           python watch.py check --repeat 8 --interval 180 ;;
          esac

      - name: 保存状态
        # 即使上一步以非 0 退出也要保存：--repeat 连跑多轮，某一轮推送失败不该
        # 让前面几轮已经送达的记录丢掉（丢了下一次会重推一遍）。
        # "没送达不记状态"由代码本身保证，不依赖这个 if。
        # 排除 cancelled()：被取消的 job 状态可能只写了一半。
        if: success() || failure()
        run: |
          set -euo pipefail
          git config user.name  "k-one-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "状态无变化，不产生 commit"
            exit 0
          fi
          git commit -m "chore(state): 更新已通知的空位 [skip ci]"
          # 万一有并发的 push 抢先落地，rebase 一次再试
          git push || (git pull --rebase --autostash && git push)
