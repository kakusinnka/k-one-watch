name: ci

on:
  push:
    branches: [main]
    # 机器人回写状态的 commit 不需要跑测试
    paths-ignore: ['state/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 全部离线跑，用 tests/fixtures 里的真实响应快照，不触网
      - run: python -m unittest discover -s tests -v
